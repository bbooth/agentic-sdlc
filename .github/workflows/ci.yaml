name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm test
      - run: npm run check:examples
      # Every example config is one check-config accepts.
      - name: Example configs are valid
        run: |
          for d in plugins/sdlc/examples/*/; do
            rollout=()
            [ -f "$d/rollout.json" ] && rollout=(--rollout "$d/rollout.json")
            node plugins/sdlc/bin/check-config.mjs "$d/config.json" "${rollout[@]}"
          done
      # The plugin runs in any project: its prose points at the plugin's own
      # files (<plugin>/...) and the project's .sdlc/, never at one project.
      # onboard-project is left out: writing a project's settings and
      # removing an old copy of the pipeline is its job.
      - name: Skills and agents name no project's paths
        run: |
          if grep -nE '\.sdlc/(bin|templates|schema)|\.claude/(agents|settings)|docs/STATUS\.md|deploy/CLAUDE\.md|\bTRU-[0-9]' $(ls plugins/sdlc/skills/*/SKILL.md | grep -v /onboard-project/) plugins/sdlc/agents/*.md; then
            echo "::error::A skill or agent names one project's paths"
            exit 1
          fi

  # The reusable workflows run in other repos, where a mistake shows up
  # only when a project calls them.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
