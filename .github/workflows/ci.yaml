name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm test
      - run: npm run check:examples
      # Every example config parses and names the keys the gates read.
      - name: Example configs are valid
        run: |
          for f in examples/*/config.json; do
            node -e '
              const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const need = ["ships", "generated", "areas", "reviewScopes", "tests"];
              const missing = need.filter((k) => !(k in c));
              if (missing.length) { console.error(process.argv[1] + " lacks: " + missing.join(", ")); process.exit(1); }
            ' "$f"
          done
